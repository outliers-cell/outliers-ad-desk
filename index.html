<style>
/* Layout: sticky scoreboard-style header with section tabs; one working area below; tables and boards scroll inside their own boxes. */
:root{
  --bg:#f1f2f5; --surface:#ffffff; --surface2:#e8eaef; --line:#d3d7df;
  --fg:#14171f; --muted:#596072;
  --accent:#7c021e; --accent-ink:#ffffff; --cyan:#0b7f96; --cyan-fill:#0bc8ee;
  --ok:#17692f; --ok-bg:#dcf1e3; --warn:#7d5200; --warn-bg:#faebc4;
  --bad:#9c1219; --bad-bg:#fadcdd; --info:#2f4a78; --info-bg:#e0e8f6;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161a22; --surface2:#1e2330; --line:#2b3242;
    --fg:#e8ebf1; --muted:#9aa3b5;
    --accent:#f0627f; --accent-ink:#1b0509; --cyan:#3fd2ee; --cyan-fill:#0bc8ee;
    --ok:#6fd48c; --ok-bg:#12301c; --warn:#f0c15a; --warn-bg:#35280a;
    --bad:#ff8a90; --bad-bg:#3a1417; --info:#9db8ec; --info-bg:#1a2742;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface2:#1e2330; --line:#2b3242;
  --fg:#e8ebf1; --muted:#9aa3b5;
  --accent:#f0627f; --accent-ink:#1b0509; --cyan:#3fd2ee; --cyan-fill:#0bc8ee;
  --ok:#6fd48c; --ok-bg:#12301c; --warn:#f0c15a; --warn-bg:#35280a;
  --bad:#ff8a90; --bad-bg:#3a1417; --info:#9db8ec; --info-bg:#1a2742;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--accent)}
.top-in{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;align-items:baseline;gap:8px}
.brand i{font-style:normal;color:var(--accent)}
.brand small{font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--muted)}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
nav a{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:6px 12px;border-bottom:3px solid transparent;margin-bottom:-3px}
nav a:hover{color:var(--fg)}
nav a.on{color:var(--fg);border-bottom-color:var(--cyan-fill)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.banner{border:1px solid var(--line);border-left:5px solid var(--warn);background:var(--warn-bg);color:var(--fg);padding:10px 14px;border-radius:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.banner.info{border-left-color:var(--cyan);background:var(--info-bg)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:34px;text-transform:uppercase;line-height:1}
.page-h p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel>h3{font-size:20px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.panel>h3 span{font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.strip{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.strip>div{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.strip>div:last-child{border-right:0}
.strip b{display:block;font-family:var(--font-display);font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.strip em{font-style:normal;font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:78px 1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.row .d small{display:block;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--muted)}
.row .t{min-width:0}
.row .t small{display:block;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:6px 0}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.03em;padding:1px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.na{background:var(--surface2);color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;margin-right:2px;letter-spacing:.03em}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.no{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.chip.na{background:var(--surface2);color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.filters select,.filters input[type=search],.filters input[type=text],.filters input[type=date],.filters input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:120px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg)}
.filters .chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);padding-bottom:7px}
.tbl-box{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-family:var(--font-display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.mo td{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);color:var(--accent);padding:5px 10px}
tr.g{cursor:pointer}
tr.g:hover td{background:var(--surface2)}
tr.det td{background:var(--surface2);font-size:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dim{color:var(--muted)}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 24px}
.det-grid b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:8px;font-size:13.5px}
.bar i{display:block;height:14px;background:var(--cyan-fill);border-radius:2px;min-width:2px}
.bar.m i{background:var(--accent)}
.stack{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:5px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.fields label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.fields textarea,.fields input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-weight:400;min-width:0;width:100%;resize:vertical}
.fields textarea{min-height:110px}
.board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start}
.col{background:var(--surface2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col>h3{font-size:18px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cyan-fill);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card.hi{border-left-color:var(--accent)}
.card.over{border-color:var(--bad)}
.card .m{font-size:13px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap}
.card .a{display:flex;gap:6px;flex-wrap:wrap}
.card .tt{font-weight:600;overflow-wrap:anywhere}
.fxgrid{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-top:6px}
.fxgrid label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
.fxgrid input,.fxgrid select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--fg);min-width:0;width:100%}
.fxgrid .wide{grid-column:1/-1}
.card.done{border-left-color:var(--ok);opacity:.92}
.fxsrc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.scrub{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cyan-fill);border-radius:8px;padding:12px 14px;margin-top:14px}
.scrub h3{font-size:20px;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.scrub h3 span{font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.srow{display:grid;grid-template-columns:minmax(110px,160px) 112px 78px minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-of-type{border-top:0}
.srow .dt{color:var(--muted);overflow-wrap:anywhere}
@media (max-width:620px){.srow{grid-template-columns:1fr auto}.srow .dt{grid-column:1/-1}.srow .tm{display:none}}
.skel{color:var(--muted);padding:30px 0;text-align:center}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}.brand small{display:none}}
@media (max-width:520px){nav{flex:1 1 100%}nav a{padding:6px 8px;font-size:15px}.row{grid-template-columns:66px 1fr}.row>:last-child{grid-column:2}.page-h h2{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .12s}}

#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden]{display:none}
.gbox{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:12px}
.gtitle{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:30px;font-weight:700;letter-spacing:.02em}
.gtitle i{font-style:normal;color:var(--accent)}
.gsub{margin:0;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.gmsg{margin:0;min-height:1.2em;color:var(--bad);font-size:14px}
.gnote{margin:0;color:var(--muted);font-size:13px}
.who{font-size:12px;color:var(--muted);margin-right:8px}
</style>

<script>
/* Outliers AD Desk standalone layer: Google sign-in + Google Sheets as the data store.
   Provides window.claude.use("mcp"|"db"|"user") so the app code runs unchanged. */
(function(){
"use strict";
const CLIENT_ID="267709633404-4gmbf096fe1snmfh9ih69elts63v3bmr.apps.googleusercontent.com";
const SHEET="1pdrFTxkaBfOKv13y1E2D_qttII215H-_5kygHQHNA_M";
const SCOPES="https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email";
const API="https://sheets.googleapis.com/v4/spreadsheets/"+SHEET;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const COLS={
  tasks:{tab:"Tasks",n:12},
  strategy:{tab:"Strategy",n:6},
  fixes:{tab:"Fixes State",n:13},
  scrubreq:{tab:"Scrub Requests",n:7}
};
let token=null,tokenExp=0,tc=null,me={email:"",name:"",role:"viewer",sport:""};
const cache={};            // sheet name -> last values read (for sport lookups)
const docsCache={};        // collection -> {id:data}
const subs={};             // collection -> [handlers]
let readyRes,readyRej;const ready=new Promise((a,b)=>{readyRes=a;readyRej=b;});
let signedIn=false;

function err(code,msg){const e=new Error(msg||code);e.code=code;return e;}
function $(id){return document.getElementById(id);}

/* ---------- sign-in ---------- */
function gate(show,msg){
  let g=$("gate");
  if(!g){
    g=document.createElement("div");g.id="gate";
    g.innerHTML='<div class="gbox"><div class="gtitle"><i>Outliers</i> AD Desk</div><p class="gsub">Fayetteville Homeschool Sports</p><p id="gmsg" class="gmsg"></p><button id="gbtn" class="btn pri" type="button">Sign in with Google</button><p class="gnote">Use your fayhomeschoolsports.org account.</p></div>';
    document.body.appendChild(g);
    $("gbtn").addEventListener("click",()=>requestToken(true).catch(()=>{}));
  }
  g.hidden=!show;
  if(msg!=null)$("gmsg").textContent=msg;
}
function waitGsi(){
  return new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);res();}else if(++n>100){clearInterval(t);rej(err("gsi_unavailable","Google sign-in could not load. Check your connection."));}},100);});
}
let pending=null;
function requestToken(interactive){
  if(pending)return pending;
  pending=new Promise(async(res,rej)=>{
    try{
      await waitGsi();
      if(!tc){
        tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,hd:"fayhomeschoolsports.org",callback:()=>{},error_callback:()=>{}});
      }
      tc.callback=r=>{
        pending=null;
        if(r&&r.access_token){token=r.access_token;tokenExp=Date.now()+(+r.expires_in||3600)*1000;try{localStorage.setItem("ad_signed","1");}catch(e){}res(token);}
        else{rej(err("needs_reauth",(r&&r.error)||"Sign-in failed"));}
      };
      tc.error_callback=e=>{pending=null;rej(err("needs_reauth",(e&&e.type)||"Sign-in was closed"));};
      tc.requestAccessToken({prompt:interactive?"select_account":""});

const FX_DEC=["","Confirmed","Tentative","Ignore","Cancelled","Postponed","Needs follow-up"];
const FX_WRITE_STATUS={confirmed:"Confirmed",tentative:"Tentative",cancelled:"Cancelled",postponed:"Postponed"};
function fkey(f){return "f"+slug([f.n,f.check,f.gid||f.sport,f.date].join("-")).slice(0,120);}
function fixState(f,e){
  const sheetDec=String(f.decision||"").trim();
  const dec=(e.decision!==undefined?e.decision:sheetDec).trim();
  let st="open";
  if(e.verified)st="verified";else if(e.applied)st="applied";
  else if(dec.toLowerCase()==="ignore")st="ignored";
  else if(f.custom){st=dec?"done":"open";}
  else if(sheetDec&&e.decision===undefined)st="sheet";
  else if(dec)st="saved";
  return {st,dec,resolved:["verified","ignored","sheet","done"].includes(st)};
}
function fixList(){
  const out=S.fix.map(f=>{const key=fkey(f),e=S.fixes[key]||{};return Object.assign({},f,{key,e},fixState(f,e));});
  Object.keys(S.fixes).forEach(k=>{const v=S.fixes[k];if(v&&v.custom){const f={key:k,custom:true,n:"+",sev:v.sev||"MED",check:"MANUAL",sport:v.sport||"",level:v.level||"",date:v.date||"",gid:v.gid||"",wrong:v.wrong||"",tracker:"",band:"",mp:"",decision:v.decision||""};out.push(Object.assign(f,{e:v},fixState(f,v)));}});
  return out;
}
const FX_PILL={open:["Open","warn"],saved:["Saved, not applied","info"],applied:["Applied, waiting for a scrub","info"],verified:["Verified","ok"],ignored:["Ignored","na"],sheet:["Decided in the sheet","ok"],done:["Done","ok"]};
function t24(v){
  const m=String(v||"").trim().toLowerCase().replace(/\./g,"").match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?$/);
  if(!m)return null;let h=+m[1];const mi=m[2]?+m[2]:0;const ap=m[3];
  if(ap){if(h<1||h>12)return null;if(ap[0]==="p"&&h<12)h+=12;if(ap[0]==="a"&&h===12)h=0;}
  if(h>23||mi>59)return null;
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}
function normHA(v){const x=String(v||"").trim().toLowerCase();return x==="home"?"Home":x==="away"?"Away":x==="neutral"?"Neutral":"";}
function fxPlan(f,vals){
  if(!f.gid)return {err:"This fix has no Game ID, so the page cannot find the Games row."};
  const g=S.games.find(x=>x.id===f.gid);
  if(!g)return {err:"No Games row has ID "+f.gid+"."};
  const ch=[];const want={};
  if(vals.time){const t=t24(vals.time);if(!t)return {err:"Could not read the time \""+vals.time+"\". Use 5:00 PM or 17:00."};ch.push({col:"G",label:"start time",val:"'"+t,show:t});want.time=t;}
  const ha=normHA(vals.ha);if(ha){ch.push({col:"I",label:"home or away",val:ha,show:ha});want.ha=ha;}
  if(vals.opp){ch.push({col:"H",label:"opponent",val:vals.opp,show:vals.opp});want.opp=vals.opp;}
  const st=FX_WRITE_STATUS[String(vals.decision||"").toLowerCase()];if(st){ch.push({col:"K",label:"status",val:st,show:st});want.status=st;}
  if(!ch.length)return {err:"Nothing to write. Enter a time, home or away, an opponent, or a Confirmed, Tentative, Cancelled or Postponed decision."};
  return {g,ch,want,sum:"Games row "+g.row+" ("+g.id+"): "+ch.map(c=>c.label+" = "+c.show).join(", ")};
}
function fxCheck(g,want){
  const bad=[];
  if(want.time&&t24(g.time)!==want.time)bad.push("start time is "+(g.time||"blank"));
  if(want.ha&&normHA(g.ha)!==want.ha)bad.push("home or away is "+(g.ha||"blank"));
  if(want.opp&&norm(g.opp)!==norm(want.opp))bad.push("opponent is "+(g.opp||"blank"));
  if(want.status&&String(g.status||"").trim().toLowerCase()!==want.status.toLowerCase())bad.push("status is "+(g.status||"blank"));
  return bad;
}

  const rank=s=>/high/i.test(s)?0:/med/i.test(s)?1:2;

  const card=x=>{
    const e=x.e||{},time=e.time!==undefined?e.time:(x.time||""),ha=e.ha!==undefined?e.ha:(x.ha||""),opp=e.opp!==undefined?e.opp:(x.opp||""),dec=x.dec;
    const sv=S.scrub&&S.scrub.verify&&S.scrub.verify[x.key];
    const msg=S.fxMsg[x.key]||(x.st==="verified"?"Verified "+(e.verifiedAt?new Date(e.verifiedAt).toLocaleDateString([],{month:"short",day:"numeric"}):""):x.st==="applied"?"Written "+(e.appliedAt?new Date(e.appliedAt).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"")+". Run Refresh scrub to confirm.":e.updated?"Saved":"");

function viewBudget(){

  const by={};
  S.games.forEach(g=>{const k=g.sport||"Blank";const o=by[k]||(by[k]={n:0,withCost:0,total:0,missing:0,months:{}});o.n++;const c=num(g.ref);
    if(c!=null){o.withCost++;o.total+=c;if(g.d!=null){const d=dd(g.d);const mk=d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");o.months[mk]=(o.months[mk]||0)+c;}}
    else if(String(g.status).toLowerCase().startsWith("confirm")&&/^home/i.test(g.ha))o.missing++;});

function fxMsg(k,t){S.fxMsg[k]=t;const m=document.getElementById("fxm-"+k);if(m)m.textContent=t;}
function fxSave(k,btn){

async function fxApply(k,btn){
  if(!S.mcp||!db){fxMsg(k,"No sheet access from this view");return;}
  const f=fixList().find(x=>x.key===k);if(!f)return;
  const card=btn.closest(".fixcard");const vals=fxRead(card);
  const plan=fxPlan(f,vals);
  if(plan.err){S.armed=null;fxMsg(k,plan.err);btn.textContent="Apply to Games tab";btn.classList.remove("pri");return;}
  if(!S.armed||S.armed.key!==k||S.armed.sum!==plan.sum){S.armed={key:k,sum:plan.sum};btn.textContent="Confirm: "+plan.sum;btn.classList.add("pri");fxMsg(k,"Click the button again to write this to your Games tab. Reload the page to cancel.");return;}
  S.armed=null;btn.disabled=true;
  const saved=await fxSave(k,btn);if(!saved){btn.disabled=false;return;}
  fxMsg(k,"Writing to the Games tab...");
  try{
    for(const c of plan.ch){await S.mcp.callTool(SERVER,"update_values",{spreadsheetId:SHEET,range:"Games!"+c.col+plan.g.row,values:[[c.val]]});}
    try{await S.mcp.callTool(SERVER,"update_values",{spreadsheetId:SHEET,range:"'Fix Queue'!L"+f.row+":O"+f.row,values:[[vals.time||"",vals.ha||"",vals.opp||"",vals.decision||""]]});}catch(e2){}
    const done=Object.assign({},saved,{applied:true,appliedAt:Date.now(),want:plan.want,gid:f.gid,verified:false,verifiedAt:null});
    S.fixes[k]=done;await db.doc("fixes/"+k).set(done).catch(()=>{});
    fxMsg(k,"Written to Games row "+plan.g.row+". Checking it now...");
    runScrub({quick:true});
  }catch(e){
    const c=(e&&e.code)||"error";
    fxMsg(k,c==="approval_required"||c==="consent_required"||c==="not_in_manifest"?"The sheet write was not allowed. Reload the page and choose Allow. Your fix is saved here.":"Not written to the Games tab ("+c+"). Your fix is saved here. Anything already written is listed in the scrub.");
  }
  btn.disabled=false;
}

/* ---------- scrub ---------- */
const PLATFORMS=["BAND","MaxPreps","DragonFly","GameChanger"];
const SRC_NAMES={games:"Games tab",contacts:"Contacts tab",comms:"Comms Log tab",ad:"AD Status tab",fix:"Fix Queue tab"};
function tm(ts){return ts?new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"}):"";}
function rowCount(k){return {games:S.games,contacts:S.contacts,comms:S.comms,ad:S.ad,fix:S.fix}[k].length;}
function renderScrub(){
  const w=$("scrubwrap");if(!w)return;
  const sc=S.scrub;if(!sc){w.innerHTML="";return;}
  const st={wait:["Waiting","na"],run:["Checking...","info"],ok:["Checked","ok"],warn:["Checked, see note","warn"],err:["Failed","bad"],manual:["Needs Claude","na"],skip:["Skipped","na"]};
  const row=(name,it)=>{const s=st[it.state]||st.wait;return `<div class="srow"><b>${esc(name)}</b><span>${pill(s[0],s[1])}</span><span class="tm num dim">${esc(tm(it.at))}</span><span class="dt">${it.html||esc(it.detail||"")}</span></div>`;};
  const plat=PLATFORMS.map(p=>{
    const r=S.scrubreq[p]||{};let d,state="manual";
    if(r.status==="requested"){d=`Requested ${esc(new Date(r.requestedAt).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))}. Open a chat with Claude to run it.`;}
    else if(r.status==="done"){state="ok";d=`Checked by Claude ${esc(r.checkedAt?new Date(r.checkedAt).toLocaleDateString([],{month:"short",day:"numeric"}):"")}${r.summary?": "+esc(r.summary):""}`;}
    else d="Not scrubbed from this page. BAND, MaxPreps, DragonFly and GameChanger need a login that only Claude's browser has.";
    const btn=S.dbOk&&S.canWrite!==false&&r.status!=="requested"?` <button class="btn sm" data-act="req" data-p="${esc(p)}">Request scrub</button>`:"";
    return `<div class="srow"><b>${esc(p)}</b><span>${pill(state==="ok"?"Last scrub on file":r.status==="requested"?"Requested":"Not automatic",state==="ok"?"ok":r.status==="requested"?"info":"na")}</span><span class="tm num dim">${esc(r.checkedAt?tm(r.checkedAt):"")}</span><span class="dt">${d}${btn}</span></div>`;}).join("");
  const done=!sc.running&&sc.finishedAt;
  w.innerHTML=`<section class="scrub"><h3>Scrub<span>${sc.running?"Running since "+esc(tm(sc.startedAt)):done?"Finished "+esc(tm(sc.finishedAt)):""} <button class="btn sm ghost" data-act="scrubhide">Hide</button></span></h3>
    ${Object.keys(SRC_NAMES).map(k=>row(SRC_NAMES[k],sc.items[k]||{state:"wait"})).join("")}
    ${row("Fix confirmation",sc.items.verify||{state:"wait"})}
    ${row("Gmail",sc.items.gmail||{state:"wait"})}
    ${plat}</section>`;
}
async function runScrub(opt){
  opt=opt||{};
  if(!S.mcp){S.scrub={running:false,items:{}};renderScrub();return;}
  if(S.scrub&&S.scrub.running)return;
  const sc=S.scrub={running:true,startedAt:Date.now(),finishedAt:null,items:{},verify:{}};
  Object.keys(SRC_NAMES).forEach(k=>sc.items[k]={state:"wait"});sc.items.verify={state:"wait"};sc.items.gmail={state:opt.quick?"skip":"wait",detail:opt.quick?"Not part of a quick check after a fix.":""};
  const btn=$("scrubbtn");if(btn){btn.disabled=true;btn.textContent="Scrubbing...";}
  renderScrub();
  for(const k of Object.keys(SRC_NAMES)){
    sc.items[k]={state:"run"};renderScrub();
    try{const r=await S.mcp.callTool(SERVER,TOOL,{spreadsheetId:SHEET,range:SRC[k]});handler(k)({type:"data",result:r});
      sc.items[k]={state:"ok",at:Date.now(),detail:rowCount(k)+" rows read"};}
    catch(e){const c=(e&&e.code)||"error";handler(k)({type:"error",error:e});sc.items[k]={state:"err",at:Date.now(),detail:"Could not read ("+c+(e&&e.message?": "+String(e.message).slice(0,160):"")+")"+(c==="approval_required"?". Use Allow and load at the top, then run again.":"")};}
    renderScrub();
  }
  // confirm applied fixes against the freshly read Games tab
  sc.items.verify={state:"run"};renderScrub();
  try{
    if(sc.items.games.state!=="ok")throw new Error("The Games tab was not read.");
    const pend=Object.entries(S.fixes).filter(([k,v])=>v&&v.applied&&!v.verified&&v.want);
    let okN=0,badN=0;
    for(const [k,v] of pend){
      const g=S.games.find(x=>x.id===v.gid);
      const bad=g?fxCheck(g,v.want):["no Games row has ID "+v.gid];
      if(!bad.length){okN++;const nv=Object.assign({},v,{verified:true,verifiedAt:Date.now()});S.fixes[k]=nv;if(db)db.doc("fixes/"+k).set(nv).catch(()=>{});sc.verify[k]=[];}
      else{badN++;sc.verify[k]=bad;}
    }
    sc.items.verify={state:badN?"warn":"ok",at:Date.now(),detail:pend.length?okN+" fix"+(okN===1?"":"es")+" confirmed on the Games tab"+(badN?", "+badN+" still not matching (see the Fixes page)":"."):"No applied fixes are waiting for confirmation."};
  }catch(e){sc.items.verify={state:"err",at:Date.now(),detail:e.message};}
  renderScrub();
  if(!opt.quick)await gmailCheck(sc);
  sc.running=false;sc.finishedAt=Date.now();
  if(btn){btn.disabled=false;btn.textContent="Refresh scrub";}
  renderScrub();render();
}
async function gmailCheck(sc){
  sc.items.gmail={state:"run"};renderScrub();
  try{
    const r=await S.mcp.callTool("Gmail","search_threads",{query:"newer_than:14d -category:promotions -category:social",pageSize:50,view:"THREAD_VIEW_METADATA_ONLY"});
    let p=r&&r.payload;if(typeof p==="string"){try{p=JSON.parse(p);}catch(e){p=null;}}
    if(!p&&r&&r.content&&r.content[0]&&r.content[0].text){try{p=JSON.parse(r.content[0].text);}catch(e){p=null;}}
    const threads=(p&&p.threads)||[];
    const byEmail=new Map();
    S.contacts.forEach(c=>{(String(c.email||"").match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g)||[]).forEach(e=>byEmail.set(e.toLowerCase(),c.school));});
    const seen={};
    threads.forEach(t=>(t.messages||[]).forEach(m=>{
      const d=Date.parse(m.date);if(isNaN(d))return;
      const sent=(m.labelIds||[]).includes("SENT");
      const who=sent?[...(m.toRecipients||[]),...(m.ccRecipients||[])]:[m.sender];
      who.forEach(a=>{const mm=String(a||"").toLowerCase().match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/);const sch=mm&&byEmail.get(mm[0]);if(sch){const o=seen[sch]||(seen[sch]={out:0,inn:0});if(sent)o.out=Math.max(o.out,d);else o.inn=Math.max(o.inn,d);}});
    }));
    const idx=new Map(schoolIndex().map(s=>[s.school,s]));
    const stale=[];
    Object.entries(seen).forEach(([sch,o])=>{const g=Math.max(o.out,o.inn);const t=idx.get(sch);const gu=Date.UTC(new Date(g).getFullYear(),new Date(g).getMonth(),new Date(g).getDate());if(!t||t.last==null||gu>t.last)stale.push({sch,g:gu,trk:t&&t.last});});
    stale.sort((a,b)=>b.g-a.g);
    const nSch=Object.keys(seen).length;
    const html=esc("Scanned "+threads.length+" threads from the last 14 days. "+nSch+" schools on file appear. ")+(stale.length?`<b>${stale.length} newer than the tracker:</b> `+esc(stale.slice(0,8).map(x=>x.sch+" (Gmail "+fmtD(x.g)+", tracker "+(x.trk?fmtD(x.trk):"none")+")").join("; ")+(stale.length>8?"; and "+(stale.length-8)+" more":"")):"The tracker's last-contact dates match.");
    sc.items.gmail={state:stale.length?"warn":"ok",at:Date.now(),html};
  }catch(e){const c=(e&&e.code)||"error";sc.items.gmail={state:"err",at:Date.now(),detail:c==="not_in_manifest"||c==="consent_required"?"The Gmail check is only available in Brett's Claude chat, not in this app.":c==="server_not_connected"?"The Gmail check is only available in Brett's Claude chat, not in this app.":"Could not check Gmail ("+c+(e&&e.message?": "+String(e.message).slice(0,160):"")+")."};}
  renderScrub();
}
let stT=null;
function newId(){return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function putTask(t){return db.doc("tasks/"+t.id).set(t).catch(e=>{if(e.code==="invalid_argument"){S.canWrite=false;}S.saveMsg="Not saved ("+(e.code||"error")+")";softRender();});}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="toggle"){S.open[el.dataset.id]=!S.open[el.dataset.id];render();}
  else if(a==="refresh"){S.mcp?S.mcp.invalidate().catch(()=>{}).then(()=>{}):location.reload();}
  else if(a==="strat"){saveStrat();S.f.strat=el.dataset.sport;render();}
  else if(a==="mv"&&db){const t=S.tasks.find(x=>x.id===el.dataset.id);if(t){const n=Object.assign({},t,{status:el.dataset.to});delete n.id;putTask(Object.assign({id:t.id},n));}}
  else if(a==="rmask"){S.open["rm"+el.dataset.id]=true;render();}
  else if(a==="rm"&&db){db.doc("tasks/"+el.dataset.id).delete().catch(()=>{});delete S.open["rm"+el.dataset.id];}
  else if(a==="weekpack"&&db&&S.f.weekGame){
    const u=isoToU(S.f.weekGame),ds=fmtD(u),on=S.games.filter(g=>g.d===u),sp=on.length&&uniq(on.map(g=>g.sport)).length===1?on[0].sport:"";
    [["Confirm "+ds+" games in BAND",-7,"high"],["Check officials for "+ds,-5,"normal"],["Review Buffer post draft for "+ds,-1,"normal"],["Enter "+ds+" results (MaxPreps, BAND)",1,"normal"]].forEach(x=>putTask({id:newId(),title:x[0],sport:sp,due:iso(u+x[1]*DAY),status:"todo",priority:x[2],notes:"",created:Date.now()}));
    S.f.weekGame="";render();
  }
  else if(a==="fxsave"&&db){fxSave(el.dataset.key,el);}
  else if(a==="fxapply"){fxApply(el.dataset.key,el);}
  else if(a==="scrub"){runScrub();}
  else if(a==="scrubhide"){S.scrub=null;renderScrub();}
  else if(a==="req"&&db){db.doc("scrubreq/"+el.dataset.p).set({status:"requested",requestedAt:Date.now(),platform:el.dataset.p}).catch(()=>{});}
  else if(a==="fxclear"&&db){const k=el.dataset.key;const e=Object.assign({},S.fixes[k]||{},{decision:"",applied:false,verified:false,want:null,updated:Date.now()});db.doc("fixes/"+k).set(e).catch(()=>{});}
  else if(a==="fxdel"&&db){db.doc("fixes/"+el.dataset.key).delete().catch(()=>{});}
  else if(a==="copybrief"){copyBrief(el);}
  else if(a==="allow"){allowAll();}
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.sf!==undefined){clearTimeout(stT);stT=setTimeout(saveStrat,900);return;}
  if(el.dataset.f&&el.type!=="checkbox"&&el.tagName!=="SELECT"){S.f[el.dataset.f]=el.value;const id=el.id,pos=el.selectionStart;render();const n=id&&$(id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.sf!==undefined){clearTimeout(stT);saveStrat();return;}
  if(el.dataset.f){S.f[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;render();}
});
document.addEventListener("focusout",()=>{if(S.dirty)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches("textarea,input")))render();},50);});
document.addEventListener("submit",ev=>{
  if(ev.target.id==="fxnew"){ev.preventDefault();if(!db)return;const wrong=$("fn-wrong").value.trim();if(!wrong)return;
    const id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    db.doc("fixes/"+id).set({custom:true,sev:"MED",sport:$("fn-sport").value,date:$("fn-date").value,gid:$("fn-gid").value.trim(),wrong,decision:"",created:Date.now(),updated:Date.now()}).catch(()=>{});
    ev.target.reset();return;}
  if(ev.target.id!=="tform")return;ev.preventDefault();
  if(!db)return;
  const title=$("t-title").value.trim();if(!title)return;
  const sp=$("t-sport").value;
  putTask({id:newId(),title,sport:sp==="All sports"?"":sp,due:$("t-due").value||"",status:"todo",priority:$("t-pri").value,notes:$("t-notes").value.trim(),created:Date.now()});
  ev.target.reset();
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

function copyBrief(btn){
  const t=todayU(),up=S.games.filter(upcoming).sort(sortG);
  const next=up.filter(g=>g.d-t<=14*DAY).slice(0,10);
  const un=up.filter(g=>!/^confirm/i.test(g.status)&&g.d-t<=75*DAY).slice(0,10);
  const wait=schoolIndex().filter(s=>s.waiting).sort((a,b)=>b.waitDays-a.waitDays).slice(0,8);
  const due=S.tasks.filter(x=>x.status!=="done"&&isoToU(x.due)!=null&&isoToU(x.due)-t<=7*DAY).sort((a,b)=>isoToU(a.due)-isoToU(b.due));
  const L=["AD briefing, "+fmtD(t,true),"","Next 14 days:"];
  (next.length?next:[null]).forEach(g=>L.push(g?"-"+fmtD(g.d,true)+" "+fmtT(g.time)+", "+g.sport+" "+g.level+" vs "+g.opp+" ("+g.ha+", "+g.status+")":"-Nothing on the schedule"));
  L.push("","Not confirmed yet:");(un.length?un:[null]).forEach(g=>L.push(g?"-"+fmtD(g.d)+" "+g.sport+" "+g.level+" "+g.opp+" ("+g.status+")":"-Nothing"));
  L.push("","Waiting on replies:");(wait.length?wait:[null]).forEach(s=>L.push(s?"-"+s.school+", "+s.waitDays+" days":"-None"));
  L.push("","Tasks due in 7 days:");(due.length?due:[null]).forEach(x=>L.push(x?"-"+fmtD(isoToU(x.due))+" "+x.title:"-None"));
  const txt=L.join("\n");
  const done=ok=>{btn.textContent=ok?"Copied":"Select and copy below";if(!ok){const pre=document.createElement("textarea");pre.value=txt;pre.style.cssText="width:100%;height:220px;margin-top:10px";btn.parentNode.appendChild(pre);pre.select();}setTimeout(()=>{btn.textContent="Copy briefing text";},2500);};
  try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false));}catch(e){done(false);}
}

/* ---------- boot ---------- */
async function allowAll(){
  if(!S.mcp)return;
  for(const k of Object.keys(SRC)){
    try{const r=await S.mcp.callTool(SERVER,TOOL,{spreadsheetId:SHEET,range:SRC[k]});handler(k)({type:"data",result:r});}
    catch(e){handler(k)({type:"error",error:e});}
  }
}
async function boot(){
  render();
  const claude=window.claude;
  if(!claude||!claude.use){S.mcpNull=true;render();return;}
  try{
    const [mcp,dbx,user]=await Promise.all([claude.use("mcp"),claude.use("db"),claude.use("user")]);
    if(user){try{S.canWrite=user.can?user.can("data.write"):null;}catch(e){}}
    if(dbx){
      db=dbx;S.dbOk=true;
      db.collection("tasks").onSnapshot(s=>{S.tasks=s.docs.map(d=>Object.assign({id:d.id},d.data()));softRender();},()=>{S.dbOk=false;softRender();});
      db.collection("scrubreq").onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S.scrubreq=o;renderScrub();},()=>{});
      db.collection("fixes").onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S.fixes=o;softRender();},()=>{});
      db.collection("strategy").onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S.strat=o;if(!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.sf!==undefined))softRender();},()=>{});
    }
    if(!mcp){S.mcpNull=true;render();return;}
    S.mcp=mcp;
    Object.keys(SRC).forEach(k=>{
      mcp.watchTool(SERVER,TOOL,{spreadsheetId:SHEET,range:SRC[k]},handler(k),{refetchInterval:120000});
    });
  }catch(e){S.mcpNull=true;render();}
}
boot();
})();
